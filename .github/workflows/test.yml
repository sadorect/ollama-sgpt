name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Prepare test artifact directories
        run: |
          python -c "from pathlib import Path; Path('test-results').mkdir(parents=True, exist_ok=True)"

      - name: Run ruff
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          ruff check ollama_sgpt

      - name: Run black
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          black --check ollama_sgpt tests
        continue-on-error: true

      - name: Run mypy
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          mypy ollama_sgpt
        continue-on-error: true

      - name: Run tests
        run: |
          pytest --junitxml=test-results/pytest.xml

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            test-results/pytest.xml
            coverage.xml
            htmlcov/
          if-no-files-found: warn

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
